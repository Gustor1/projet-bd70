<text fill="#20354b" font-family="Arial" font-size="38" font-weight="700" text-anchor="start"><tspan x="70" y="85.42">BD70 · Cas d’utilisation — relations détaillées</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="400" text-anchor="start"><tspan x="70" y="128.82">Vue complémentaire · Les associations et les droits de la page 1 restent applicables · Les flèches ne représentent pas un ordre chronologique</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="700" text-anchor="start"><tspan x="300" y="187.82">Système de gestion d’un entrepôt logistique — sélection de cas détaillés</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="700" text-anchor="start"><tspan x="330" y="242.82">B · Rendez-vous — les vérifications concernent la création et le déplacement</tspan></text>
<ellipse cx="700.0" cy="335.0" rx="285.0" ry="55.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="700.0" y="327.56">Créer / déplacer</tspan><tspan x="700.0" y="358.76">un rendez-vous</tspan></text>
<ellipse cx="1740.0" cy="300.0" rx="285.0" ry="55.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="292.56">Vérifier la compatibilité</tspan><tspan x="1740.0" y="323.76">véhicule / quai</tspan></text>
<ellipse cx="1740.0" cy="450.0" rx="285.0" ry="55.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="442.56">Vérifier la disponibilité</tspan><tspan x="1740.0" y="473.76">du créneau</tspan></text>
<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="310" r="10" fill="white"/><path d="M125.0 320 V342 M103 335 H147 M103 364 L125.0 342 L147 364"/></g>
<text fill="#20354b" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle"><tspan x="125.0" y="382.12">Accueil</tspan></text>
<ellipse cx="700.0" cy="450.0" rx="285.0" ry="40.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="700.0" y="458.16">Annuler un rendez-vous</tspan></text>
<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="425" r="10" fill="white"/><path d="M125.0 435 V457 M103 450 H147 M103 479 L125.0 457 L147 479"/></g>
<text fill="#20354b" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle"><tspan x="125.0" y="497.12">Accueil</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="22" font-weight="400" text-anchor="start"><tspan x="350" y="514.48">Annuler un rendez-vous reste un cas distinct : aucune recherche de créneau libre n’est nécessaire.</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="700" text-anchor="start"><tspan x="330" y="597.82">D · Arrivée — une variante conditionnelle</tspan></text>
<ellipse cx="700.0" cy="700.0" rx="285.0" ry="55.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="700.0" y="692.56">Traiter une arrivée</tspan><tspan x="700.0" y="723.76">sans rendez-vous</tspan></text>
<ellipse cx="1740.0" cy="700.0" rx="310.0" ry="60.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="692.56">Enregistrer l’arrivée d’un camion</tspan><tspan x="1740.0" y="723.76">Point d’extension : saisie de l’arrivée</tspan></text>
<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="675" r="10" fill="white"/><path d="M125.0 685 V707 M103 700 H147 M103 729 L125.0 707 L147 729"/></g>
<text fill="#20354b" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle"><tspan x="125.0" y="747.12">Accueil</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="21" font-weight="400" text-anchor="start"><tspan x="990" y="741.14">[aucun rendez-vous associé]</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="700" text-anchor="start"><tspan x="330" y="882.82">E · Réception — un complément éventuel</tspan></text>
<ellipse cx="700.0" cy="985.0" rx="285.0" ry="55.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="700.0" y="993.16">Émettre une réserve</tspan></text>
<ellipse cx="1740.0" cy="985.0" rx="310.0" ry="60.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="977.56">Réceptionner les marchandises</tspan><tspan x="1740.0" y="1008.76">Point d’extension : constat à réception</tspan></text>
<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="960" r="10" fill="white"/><path d="M125.0 970 V992 M103 985 H147 M103 1014 L125.0 992 L147 1014"/></g>
<text fill="#20354b" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle"><tspan x="125.0" y="1029.4199999999998">Magasinier /</tspan><tspan x="125.0" y="1052.82">préparateur</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="21" font-weight="400" text-anchor="start"><tspan x="1010" y="1026.14">[réserve à consigner]</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="700" text-anchor="start"><tspan x="330" y="1167.82">G · Préparation et expédition — des comportements systématiques</tspan></text>
<ellipse cx="700.0" cy="1240.0" rx="285.0" ry="55.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="700.0" y="1232.5600000000002">Lancer la préparation</tspan><tspan x="700.0" y="1263.7600000000002">d’une commande</tspan></text>
<ellipse cx="1740.0" cy="1240.0" rx="285.0" ry="55.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="1232.5600000000002">Réserver le stock disponible</tspan><tspan x="1740.0" y="1263.7600000000002">selon la règle FEFO</tspan></text>
<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="1215" r="10" fill="white"/><path d="M125.0 1225 V1247 M103 1240 H147 M103 1269 L125.0 1247 L147 1269"/></g>
<text fill="#20354b" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle"><tspan x="125.0" y="1284.4199999999998">Magasinier /</tspan><tspan x="125.0" y="1307.82">préparateur</tspan></text>
<ellipse cx="700.0" cy="1410.0" rx="285.0" ry="55.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="700.0" y="1418.16">Expédier une commande</tspan></text>
<ellipse cx="1740.0" cy="1410.0" rx="285.0" ry="55.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="1402.5600000000002">Contrôler le chargement</tspan><tspan x="1740.0" y="1433.7600000000002">Colis, lots, capacité du camion</tspan></text>
<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="1385" r="10" fill="white"/><path d="M125.0 1395 V1417 M103 1410 H147 M103 1439 L125.0 1417 L147 1439"/></g>
<text fill="#20354b" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle"><tspan x="125.0" y="1454.4199999999998">Magasinier /</tspan><tspan x="125.0" y="1477.82">préparateur</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="start"><tspan x="70" y="1605.66">« include » : le cas source exécute obligatoirement le comportement inclus ; la flèche pointe vers ce comportement.</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="start"><tspan x="70" y="1655.66">« extend » : un comportement complète le cas de base sous une condition ; la flèche pointe vers le cas de base.</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="22" font-weight="400" text-anchor="start"><tspan x="70" y="1704.98">Les documents de transport peuvent être consultés / imprimés séparément : aucune inclusion automatique depuis « charger » n’est imposée.</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="22" font-weight="400" text-anchor="start"><tspan x="70" y="1754.98">FEFO : les lots dont la date de péremption arrive en premier sont prélevés en priorité. Les étapes de travail sont détaillées dans les scénarios.</tspan></text>
</svg>