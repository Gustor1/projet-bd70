<text x="40" y="44" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#20354b" text-anchor="start">BD70 · Diagramme de cas d’utilisation</text>
<text x="40" y="77" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20354b" text-anchor="start">Entrepôt logistique · Périmètre fonctionnel du projet</text>
<text x="980" y="1141" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#20354b" text-anchor="middle">Système de gestion d’un entrepôt logistique</text>
<text x="440" y="1192" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20354b" text-anchor="start">Trait simple : participation à un cas. Triangle creux : héritage vers le rôle général.</text>
<text x="440" y="1224" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#20354b" text-anchor="start">Le Responsable reprend les fonctions Accueil et Magasinier ; l’Administrateur reprend celles du Responsable.</text>
<text x="440" y="1256" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#20354b" text-anchor="start">Session active et rôle autorisé pour les opérations métier. L’inscription et la connexion sont accessibles sans session.</text>
<text x="440" y="1288" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#20354b" text-anchor="start">Portail Transporteur facultatif non retenu. « Gérer » comprend consultation, recherche et opérations autorisées.</text>
<text x="440" y="1320" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#20354b" text-anchor="start">FEFO : premier périmé, premier sorti. BL : bon de livraison. Les sous-lignes précisent le contenu des cas.</text>
