<text fill="#20354b" font-family="Arial" font-size="38" font-weight="700" text-anchor="start"><tspan x="70" y="85.42">BD70 · Gérer et préparer les commandes</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="400" text-anchor="start"><tspan x="70" y="128.82">Le responsable affecte le travail ; le préparateur traite uniquement les commandes qui lui sont affectées</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="700" text-anchor="start"><tspan x="300" y="212.82">Système de gestion d’un entrepôt logistique</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="22" font-weight="400" text-anchor="start"><tspan x="70" y="1684.98">« include » : comportement systématique, flèche vers le cas inclus. « extend » : complément conditionnel, flèche vers le cas de base.</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="22" font-weight="400" text-anchor="start"><tspan x="70" y="1734.98">Les relations expriment des dépendances fonctionnelles, pas un ordre chronologique. Une session et les droits du rôle sont requis.</tspan></text>
<ellipse cx="750.0" cy="390.0" rx="300.0" ry="65.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="750.0" y="382.56">Gérer les commandes clients</tspan><tspan x="750.0" y="413.76">Créer / modifier / annuler</tspan></text>
<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="365" r="10" fill="white"/><path d="M125.0 375 V397 M103 390 H147 M103 419 L125.0 397 L147 419"/></g>
