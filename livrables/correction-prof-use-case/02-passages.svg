<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="412.56">Contrôler les documents</tspan><tspan x="1740.0" y="443.76">d’entrée</tspan></text>
<ellipse cx="750.0" cy="690.0" rx="300.0" ry="65.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="750.0" y="682.56">Traiter une arrivée</tspan><tspan x="750.0" y="713.76">sans rendez-vous</tspan></text>
<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="665" r="10" fill="white"/><path d="M125.0 675 V697 M103 690 H147 M103 719 L125.0 697 L147 719"/></g>
<text fill="#20354b" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle"><tspan x="125.0" y="737.12">Agent d’accueil</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="22" font-weight="400" text-anchor="start"><tspan x="1040" y="574.98">[aucun rendez-vous associé]</tspan></text>
