<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="750.0" y="978.16">Appeler le camion à quai</tspan></text>
<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="945" r="10" fill="white"/><path d="M125.0 955 V977 M103 970 H147 M103 999 L125.0 977 L147 999"/></g>
<text fill="#20354b" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle"><tspan x="125.0" y="1017.12">Agent d’accueil</tspan></text>
