<text fill="#20354b" font-family="Arial" font-size="38" font-weight="700" text-anchor="start"><tspan x="70" y="85.42">BD70 · Suivre le passage d’un camion</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="400" text-anchor="start"><tspan x="70" y="128.82">Accueil : arrivée et sortie du site · Magasinier : début et fin de l’opération à quai</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="700" text-anchor="start"><tspan x="300" y="212.82">Système de gestion d’un entrepôt logistique</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="22" font-weight="400" text-anchor="start"><tspan x="70" y="1684.98">« include » : comportement systématique, flèche vers le cas inclus. « extend » : complément conditionnel, flèche vers le cas de base.</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="22" font-weight="400" text-anchor="start"><tspan x="70" y="1734.98">Les relations expriment des dépendances fonctionnelles, pas un ordre chronologique. Une session et les droits du rôle sont requis.</tspan></text>
<ellipse cx="750.0" cy="420.0" rx="300.0" ry="65.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="750.0" y="412.56">Enregistrer l’arrivée</tspan><tspan x="750.0" y="443.76">d’un camion</tspan></text>
<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="395" r="10" fill="white"/><path d="M125.0 405 V427 M103 420 H147 M103 449 L125.0 427 L147 449"/></g>
<text fill="#20354b" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle"><tspan x="125.0" y="467.12">Agent d’accueil</tspan></text>
