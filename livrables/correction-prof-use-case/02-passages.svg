<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800" role="img" aria-labelledby="02-passages-title 02-passages-desc">
<title id="02-passages-title">BD70 · Suivre le passage d’un camion</title>
<desc id="02-passages-desc">Fonctions du logiciel et relations entre les acteurs et les cas du projet BD70.</desc>
