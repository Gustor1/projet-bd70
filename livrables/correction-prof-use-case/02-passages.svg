<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="1225" r="10" fill="white"/><path d="M125.0 1235 V1257 M103 1250 H147 M103 1279 L125.0 1257 L147 1279"/></g>
<text fill="#20354b" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle"><tspan x="125.0" y="1294.4199999999998">Magasinier /</tspan><tspan x="125.0" y="1317.82">préparateur</tspan></text>
<ellipse cx="750.0" cy="1490.0" rx="300.0" ry="65.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="750.0" y="1498.16">Enregistrer le départ du site</tspan></text>
<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="1465" r="10" fill="white"/><path d="M125.0 1475 V1497 M103 1490 H147 M103 1519 L125.0 1497 L147 1519"/></g>
<text fill="#20354b" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle"><tspan x="125.0" y="1537.12">Agent d’accueil</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="22" font-weight="400" text-anchor="start"><tspan x="420" y="259.98">Ces cas détaillent « Suivre le passage d’un camion ». Les horodatages permettent le calcul des durées et des retards.</tspan></text>
