<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="962.56">Vérifier la disponibilité</tspan><tspan x="1740.0" y="993.76">et la compatibilité du quai</tspan></text>
