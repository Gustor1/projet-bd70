<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="392.56">Contrôler les colis, les lots</tspan><tspan x="1740.0" y="423.76">et la capacité du camion</tspan></text>
<ellipse cx="1740.0" cy="750.0" rx="300.0" ry="65.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="742.56">Confirmer le chargement</tspan><tspan x="1740.0" y="773.76">dans le camion sortant</tspan></text>
<ellipse cx="1740.0" cy="1100.0" rx="300.0" ry="65.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="1092.5600000000002">Enregistrer la sortie de stock</tspan><tspan x="1740.0" y="1123.7600000000002">et le statut expédié</tspan></text>
<ellipse cx="750.0" cy="1400.0" rx="300.0" ry="65.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="750.0" y="1392.5600000000002">Éditer les documents de transport</tspan><tspan x="750.0" y="1423.7600000000002">Bon de livraison / lettre de voiture</tspan></text>
<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="1375" r="10" fill="white"/><path d="M125.0 1385 V1407 M103 1400 H147 M103 1429 L125.0 1407 L147 1429"/></g>
<text fill="#20354b" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle"><tspan x="125.0" y="1444.4199999999998">Magasinier /</tspan><tspan x="125.0" y="1467.82">préparateur</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="400" text-anchor="start"><tspan x="420" y="260.32">Préconditions : commande préparée, colis constitués, camion sortant en opération à quai.</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="21" font-weight="400" text-anchor="start"><tspan x="1100" y="1479.64">Documents : expédition existante ; impression possible à nouveau sans refaire le chargement.</tspan></text>
