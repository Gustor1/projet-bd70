<text fill="#20354b" font-family="Arial" font-size="38" font-weight="700" text-anchor="start"><tspan x="70" y="85.42">BD70 · Expédier une commande</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="400" text-anchor="start"><tspan x="70" y="128.82">Magasinier / préparateur : contrôler et confirmer l’expédition · Documents consultables séparément après expédition</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="700" text-anchor="start"><tspan x="300" y="212.82">Système de gestion d’un entrepôt logistique</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="22" font-weight="400" text-anchor="start"><tspan x="70" y="1684.98">« include » : comportement systématique, flèche vers le cas inclus. « extend » : complément conditionnel, flèche vers le cas de base.</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="22" font-weight="400" text-anchor="start"><tspan x="70" y="1734.98">Les relations expriment des dépendances fonctionnelles, pas un ordre chronologique. Une session et les droits du rôle sont requis.</tspan></text>
<ellipse cx="750.0" cy="750.0" rx="300.0" ry="65.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="750.0" y="758.16">Expédier une commande</tspan></text>
<g stroke="#20354b" stroke-width="2.2" fill="none"><circle cx="125.0" cy="725" r="10" fill="white"/><path d="M125.0 735 V757 M103 750 H147 M103 779 L125.0 757 L147 779"/></g>
<text fill="#20354b" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle"><tspan x="125.0" y="794.42">Magasinier /</tspan><tspan x="125.0" y="817.8199999999999">préparateur</tspan></text>
