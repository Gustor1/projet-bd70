<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="642.56">Consulter sa réception</tspan><tspan x="1740.0" y="673.76">et sa provenance</tspan></text>
<ellipse cx="1740.0" cy="950.0" rx="300.0" ry="65.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="942.56">Consulter les emplacements</tspan><tspan x="1740.0" y="973.76">et les mouvements successifs</tspan></text>
<ellipse cx="1740.0" cy="1250.0" rx="300.0" ry="65.0" fill="#f1f6fa" stroke="#20354b" stroke-width="2"/>
<text fill="#20354b" font-family="Arial" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1740.0" y="1242.5600000000002">Consulter les commandes</tspan><tspan x="1740.0" y="1273.7600000000002">et les expéditions associées</tspan></text>
<text fill="#20354b" font-family="Arial" font-size="23" font-weight="400" text-anchor="start"><tspan x="420" y="1502.82">Chaque consultation peut retourner « aucun résultat » : un lot non expédié ne possède pas encore de commande / camion de sortie.</tspan></text>
