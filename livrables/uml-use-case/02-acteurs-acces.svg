<text fill="#20354b" font-family="Arial, sans-serif" font-size="21" text-anchor="start"><tspan x="80" y="1168.9099999999999">Gestion des comptes</tspan><tspan x="80" y="1195.79">+ toutes les fonctions du Responsable</tspan></text>
