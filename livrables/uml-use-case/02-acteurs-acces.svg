<text fill="#20354b" font-family="Arial, sans-serif" font-size="34" text-anchor="start" font-weight="bold"><tspan x="60" y="71.9">Acteurs · Généralisation et accès</tspan></text>
<text fill="#20354b" font-family="Arial, sans-serif" font-size="19" text-anchor="start"><tspan x="60" y="126.65">La pointe du triangle désigne le rôle général dont les cas d’utilisation sont hérités.</tspan></text>
