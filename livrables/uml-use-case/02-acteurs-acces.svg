<text fill="#20354b" font-family="Arial, sans-serif" font-size="21" text-anchor="middle"><tspan x="1512.0" y="900.56">Membre du personnel</tspan><tspan x="1512.0" y="927.4399999999999">non inscrit</tspan></text>
<ellipse cx="1470.0" cy="340.0" rx="200.0" ry="55.0" fill="#eef5fc" stroke="#537ea6" stroke-width="2"/>
<text fill="#20354b" font-family="Arial, sans-serif" font-size="21" text-anchor="middle"><tspan x="1470.0" y="333.91">UC01a · S’inscrire</tspan><tspan x="1470.0" y="360.79">Demander un compte</tspan></text>
<text fill="#20354b" font-family="Arial, sans-serif" font-size="19" text-anchor="start"><tspan x="1220" y="477.33">Compte créé en attente.</tspan><tspan x="1220" y="501.65">Activation par l’administrateur (UC11)</tspan><tspan x="1220" y="525.97">avant toute connexion.</tspan></text>
<text fill="#20354b" font-family="Arial, sans-serif" font-size="19" text-anchor="start"><tspan x="60" y="1302.3300000000002">Cette généralisation exprime les capacités fonctionnelles, pas la hiérarchie des personnes.</tspan><tspan x="60" y="1326.65">Le transporteur et le chauffeur sont gérés comme données : aucun portail transporteur n’est implémenté.</tspan><tspan x="60" y="1350.9700000000003">UC01 à UC10 reprennent la documentation ; UC01a détaille l’inscription et UC11 explicite l’administration des comptes.</tspan></text>
</svg>