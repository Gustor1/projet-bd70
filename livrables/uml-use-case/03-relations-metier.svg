<text fill="#20354b" font-family="Arial, sans-serif" font-size="19" text-anchor="middle"><tspan x="895" y="864.0">«include»</tspan></text>
<polyline points="690,1072.5 1100,1072.5" fill="none" stroke="#20354b" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#open)"/>
<text fill="#20354b" font-family="Arial, sans-serif" font-size="19" text-anchor="middle"><tspan x="895" y="1044.0">«include»</tspan></text>
